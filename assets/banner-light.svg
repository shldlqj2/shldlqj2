<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="유지호 · Ryu Jiho — Cloud · Infra · Embedded">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .sans { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    </style>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="19.5" fill="none" stroke="#e2e8f0"/>

  <!-- left: identity -->
  <g class="sans">
    <text x="72" y="92" font-size="14" font-weight="600" letter-spacing="3.5" fill="#0d9488">CLOUD · INFRA · EMBEDDED</text>
    <text x="72" y="162" font-size="56" font-weight="800" fill="#0f172a">유지호<tspan dx="18" font-size="28" font-weight="500" fill="#64748b">Ryu Jiho</tspan></text>
    <text x="72" y="212" font-size="21" fill="#334155">요청이 처리되는 경로를 따라가 문제의 원인을 찾습니다.</text>
    <text x="72" y="256" font-size="15" fill="#64748b">AWS SAA-C03  ·  SSAFY  ·  서울시립대학교 컴퓨터과학부</text>
  </g>

  <!-- right: request flow (Castle Coder) -->
  <g class="mono" font-size="15">
    <line x1="884" y1="152" x2="930" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1050" y1="152" x2="1096" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="907" y="136" font-size="12" text-anchor="middle" fill="#64748b">SSE</text>
    <text x="1073" y="136" font-size="12" text-anchor="middle" fill="#64748b">gRPC</text>

    <rect x="764" y="128" width="120" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="824" y="157" text-anchor="middle" fill="#1e293b">VS Code</text>
    <rect x="930" y="128" width="120" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="990" y="157" text-anchor="middle" fill="#1e293b">Backend</text>
    <rect x="1096" y="128" width="120" height="48" rx="10" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.7"/>
    <text x="1156" y="157" text-anchor="middle" fill="#1e293b">vLLM</text>

    <!-- packets travelling the request path -->
    <circle r="4" fill="#0d9488">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M884 152 H1096"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#2563eb">
      <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M884 152 H1096"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>

    <text x="764" y="216" font-size="13" fill="#64748b"><tspan fill="#0d9488">▸</tspan> active_clients=2  lock()</text>
    <text x="764" y="240" font-size="13" fill="#64748b"><tspan fill="#0d9488">▸</tspan> active_clients=0  wait 0.5s → stop()</text>
  </g>
</svg>
